name: careroute_mobile
description: CareRoute — a healthcare provider discovery app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.11.1

  # Data classes / JSON
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Persistence
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  cached_network_image: ^4.0.2

  # Misc
  intl: ^0.20.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.7.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
